<text x="48" y="480.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">An item on a book page with the status badge over its image.</text><text x="48" y="514.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Small, specific, and the moment a principle becomes visible.</text><text x="48" y="548.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">If you make one image in this section, make this one.</text>
