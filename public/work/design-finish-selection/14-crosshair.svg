<text fill="#86868B" style="white-space: pre" xml:space="preserve" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="19"><tspan x="80" y="615.409">One pixel black, one pixel white outline. Find-able on paper white and on solid black.</tspan></text>
