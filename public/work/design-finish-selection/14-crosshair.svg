<text fill="#424245" style="white-space: pre" xml:space="preserve" font-family="Inter Tight, Inter, system-ui, sans-serif" font-size="19"><tspan x="110" y="505.409">The black core carries it. The white outline does nothing here, and </tspan><tspan x="110" y="528.409">costs nothing.</tspan></text>
<path d="M828 170C828 164.477 832.477 160 838 160H1510C1515.52 160 1520 164.477 1520 170V551C1520 556.523 1515.52 561 1510 561H838C832.477 561 828 556.523 828 551V170Z" fill="#1D1D1F"/>
