<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860"><rect width="1600" height="860" fill="#F1EFE9"/><rect x="1" y="1" width="1598" height="858" fill="none" stroke="#2B5F5A" stroke-opacity=".45" stroke-width="2" stroke-dasharray="10 8"/><text x="48" y="62" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" letter-spacing="2.5" fill="#2B5F5A">PLACEHOLDER &#183; HIGHEST PRIORITY</text><line x1="48" y1="82" x2="1552" y2="82" stroke="#2B5F5A" stroke-opacity=".25" stroke-width="1"/><text x="48" y="420" font-family="Georgia, serif" font-size="46" fill="#141414">What a rejection costs</text><text x="48" y="460" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Figma diagram, two rows, exported from the file already built.</text><text x="48" y="494" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Top row: homeowner rejects, designer is told, designer reselects. Three steps.</text><text x="48" y="528" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Bottom row: rejects after approval, PM assesses, talks to whoever holds it,</text><text x="48" y="562" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">gathers scope and cost, cost goes to the homeowner, approve or cancel. Six steps.</text><text x="48" y="596" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Source: Efficiently - Stakeholder Approval Flows, board 3.</text><text x="48" y="812" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#807A72" opacity=".8">1600 &#215; 860</text></svg>