<text x="48" y="530.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Figma diagram, two states. Five bathroom locations on a plan.</text><text x="48" y="564.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Four point at TO-01, one at TO-02, each ID resolving to an item below.</text><text x="48" y="598.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Second state: TO-01 changed, four update, the fifth sits still.</text><text x="48" y="632.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Use toilets, not the hundred can lights. Clearer picture.</text>
