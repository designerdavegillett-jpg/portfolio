<text x="48" y="460.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Composite. Client portal on one side, the dense platform UI on the other,</text><text x="48" y="494.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">same project. The section argues they look nothing alike and that the</text><text x="48" y="528.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">simpler one is the easier one. Only lands if they are seen together.</text>
