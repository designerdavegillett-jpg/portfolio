<text x="48" y="340.0" font-family="Georgia, serif" font-size="46" fill="#141414">Three surfaces, one project</text>
<text x="48" y="380.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Plans page, item schedule, design book, side by side or stacked.</text><text x="48" y="414.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Same project in all three or the &#x27;one item, three views&#x27; claim proves nothing.</text><text x="48" y="448.0" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#807A72">Show mixed statuses in the schedule.</text>
